apply plugin: 'com.android.application'

def productVersion = file("../../../../VERSION").text.trim()
def versionParts = productVersion.tokenize('.').collect { Integer.parseInt(it) }
if (versionParts.size() != 3 || versionParts.any { it < 0 || it > 999 }) {
    throw new GradleException("VERSION must use numeric MAJOR.MINOR.PATCH components from 0 to 999")
}
def productVersionCode = versionParts[0] * 1000000 + versionParts[1] * 1000 + versionParts[2]
def signingValue = { String environmentName, String propertyName ->
    System.getenv(environmentName) ?: (project.findProperty(propertyName) as String)
}
def localReleaseKeystore = signingValue("AETHERX_ANDROID_KEYSTORE", "aetherxAndroidKeystore")
def localReleaseKeystorePassword = signingValue("AETHERX_ANDROID_KEYSTORE_PASSWORD", "aetherxAndroidKeystorePassword")
def localReleaseKeyAlias = signingValue("AETHERX_ANDROID_KEY_ALIAS", "aetherxAndroidKeyAlias")
def localReleaseKeyPassword = signingValue("AETHERX_ANDROID_KEY_PASSWORD", "aetherxAndroidKeyPassword")
def localReleaseSigningValues = [localReleaseKeystore, localReleaseKeystorePassword, localReleaseKeyAlias, localReleaseKeyPassword]
def localReleaseSigningReady = localReleaseSigningValues.every { it != null && !it.trim().isEmpty() }
def localReleaseSigningPartiallyConfigured = localReleaseSigningValues.any { it != null && !it.trim().isEmpty() }
def cloudReleaseKeystore = signingValue("AETHERX_CLOUD_ANDROID_KEYSTORE", "aetherxCloudAndroidKeystore")
def cloudReleaseKeystorePassword = signingValue("AETHERX_CLOUD_ANDROID_KEYSTORE_PASSWORD", "aetherxCloudAndroidKeystorePassword")
def cloudReleaseKeyAlias = signingValue("AETHERX_CLOUD_ANDROID_KEY_ALIAS", "aetherxCloudAndroidKeyAlias")
def cloudReleaseKeyPassword = signingValue("AETHERX_CLOUD_ANDROID_KEY_PASSWORD", "aetherxCloudAndroidKeyPassword")
def cloudReleaseSigningValues = [cloudReleaseKeystore, cloudReleaseKeystorePassword, cloudReleaseKeyAlias, cloudReleaseKeyPassword]
def cloudReleaseSigningReady = cloudReleaseSigningValues.every { it != null && !it.trim().isEmpty() }
def cloudReleaseSigningPartiallyConfigured = cloudReleaseSigningValues.any { it != null && !it.trim().isEmpty() }
def releaseSigningRequired = (System.getenv("AETHERX_REQUIRE_SIGNING") ?: "false").toBoolean()
def requestedTasks = gradle.startParameter.taskNames.collect { it.toLowerCase() }
def cloudReleaseRequested = requestedTasks.any { it.contains("cloudrelease") }
def localReleaseRequested = requestedTasks.any { it.contains("localrelease") || it.contains("locallanrelease") }

if (localReleaseSigningPartiallyConfigured && !localReleaseSigningReady) {
    throw new GradleException(
        "Android release signing requires AETHERX_ANDROID_KEYSTORE, " +
        "AETHERX_ANDROID_KEYSTORE_PASSWORD, AETHERX_ANDROID_KEY_ALIAS and " +
        "AETHERX_ANDROID_KEY_PASSWORD"
    )
}
if (cloudReleaseSigningPartiallyConfigured && !cloudReleaseSigningReady) {
    throw new GradleException(
        "Android Online signing requires AETHERX_CLOUD_ANDROID_KEYSTORE, " +
        "AETHERX_CLOUD_ANDROID_KEYSTORE_PASSWORD, AETHERX_CLOUD_ANDROID_KEY_ALIAS and " +
        "AETHERX_CLOUD_ANDROID_KEY_PASSWORD"
    )
}
if (releaseSigningRequired && localReleaseRequested && !localReleaseSigningReady) {
    throw new GradleException("A signed Local Android release was requested without the Local signing profile")
}
if (releaseSigningRequired && cloudReleaseRequested && !cloudReleaseSigningReady) {
    throw new GradleException("A signed Online Android release was requested without the Online signing profile")
}

android {
    namespace = "com.xuanxiaotech.aetherx.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode productVersionCode
        versionName productVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (localReleaseSigningReady) {
            create("localRelease") {
                storeFile file(localReleaseKeystore)
                storePassword localReleaseKeystorePassword
                keyAlias localReleaseKeyAlias
                keyPassword localReleaseKeyPassword
            }
        }
        if (cloudReleaseSigningReady) {
            create("cloudRelease") {
                storeFile file(cloudReleaseKeystore)
                storePassword cloudReleaseKeystorePassword
                keyAlias cloudReleaseKeyAlias
                keyPassword cloudReleaseKeyPassword
            }
        }
    }
    flavorDimensions += "edition"
    productFlavors {
        local {
            dimension "edition"
            applicationId "com.xuanxiaotech.aetherx.mobile"
            resValue "string", "app_name", "AetherX"
            resValue "string", "title_activity_main", "AetherX"
            manifestPlaceholders = [aetherxDeepLinkScheme: "aetherx"]
            buildConfigField "boolean", "CLOUD_EDITION", "false"
            if (localReleaseSigningReady) signingConfig signingConfigs.localRelease
        }
        cloud {
            dimension "edition"
            applicationId "com.xuanxiaotech.aetherx.online"
            resValue "string", "app_name", "AetherX Online"
            resValue "string", "title_activity_main", "AetherX Online"
            manifestPlaceholders = [aetherxDeepLinkScheme: "aetherx-online"]
            buildConfigField "boolean", "CLOUD_EDITION", "true"
            if (cloudReleaseSigningReady) signingConfig signingConfigs.cloudRelease
        }
    }
    buildTypes {
        debug {
            buildConfigField "boolean", "ALLOW_INSECURE_LAN", "true"
        }
        release {
            buildConfigField "boolean", "ALLOW_INSECURE_LAN", "false"
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        lanRelease {
            initWith release
            buildConfigField "boolean", "ALLOW_INSECURE_LAN", "true"
            matchingFallbacks = ["release"]
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.work:work-runtime:2.11.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
