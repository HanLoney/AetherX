    get:
      summary: 获取纪念册时刻详情
      responses:
        "200": { description: 时刻详情 }
    patch:
      summary: 更新纪念册时刻
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200": { description: 已更新并写入复制 Operation }
    delete:
      summary: 删除纪念册时刻
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "204": { description: 已先删除来源并写入时刻墓碑 }
  /album/moments/{id}/hide:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      summary: 隐藏纪念册时刻
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200": { description: 已隐藏并写入复制 Operation }
  /album/moments/{id}/sources:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      summary: 为纪念册时刻添加来源
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200": { description: 已添加或替换来源，并写入对应墓碑与 Operation }
  /album/source-candidates:
    get:
      summary: 查询可加入纪念册的来源候选
      responses:
        "200": { description: 来源候选列表 }
  /dreams:
    get:
      summary: 查询梦境
      responses:
        "200": { description: 梦境列表 }
    post:
      summary: 创建梦境
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "201": { description: 已原子创建梦境、来源及复制 Operation }
  /dreams/material:
    get:
      summary: 查询生成梦境所需材料
      responses:
        "200": { description: 梦境材料 }
  /dreams/by-date/{dreamDate}:
    parameters:
      - $ref: "#/components/parameters/DreamDate"
    get:
      summary: 按日期获取梦境
      responses:
        "200": { description: 梦境详情 }
  /dreams/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      summary: 获取梦境详情
      responses:
        "200": { description: 梦境详情 }
    patch:
      summary: 更新梦境
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200": { description: 已更新并写入复制 Operation }
    delete:
      summary: 删除梦境
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "204": { description: 已先删除来源并写入梦境墓碑 }
  /dreams/{id}/sources:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      summary: 为梦境添加来源
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200": { description: 已添加或替换来源，并写入对应墓碑与 Operation }
components:
  parameters:
    RequestId:
      in: header
      name: X-Request-Id
      required: false
      schema: { type: string, minLength: 1, maxLength: 200 }
      description: 写入幂等键。省略时由 Hub 生成；网络重试时必须复用原值。
    Id:
      in: path
      name: id
      required: true
      schema: { type: string }
    MediaId:
      in: path
      name: mediaId
      required: true
      schema: { type: string }
    Version:
      in: path
      name: version
      required: true
      schema: { type: integer, minimum: 1 }
    JournalType:
      in: path
      name: type
      required: true
      schema: { type: string }
    PeriodKey:
      in: path
      name: periodKey
      required: true
      schema: { type: string }
    DreamDate:
      in: path
      name: dreamDate
      required: true
      schema: { type: string, format: date }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
    peerHmac:
      type: apiKey
      in: header
      name: X-AetherX-Peer-Signature
      description: 与 Space、Node、Key、Timestamp、Nonce 请求头共同构成的 Peer HMAC 认证。
    mediaAccessToken:
      type: apiKey
      in: query
      name: access_token
