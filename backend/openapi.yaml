openapi: 3.1.0
info:
  title: AetherX API
  version: 1.0.0
  description: AetherX Hub 的 REST API 与 SSE 同步契约。除明确标记为公开的接口外，所有请求都需要 Bearer 认证。
  license:
    name: MIT
    identifier: MIT
  contact:
    name: AetherX Project
    url: https://github.com/HanLoney/AetherX
externalDocs:
  description: AetherX 文档中心
  url: https://github.com/HanLoney/AetherX/blob/main/docs/README.md
servers:
  - url: http://127.0.0.1:4318/api/v1
security:
  - bearerAuth: []
paths:
  /auth/config:
    get:
      security: []
      summary: 查询注册入口状态
      responses:
        "200": { description: 注册入口配置 }
  /auth/register:
    post:
      security: []
      summary: 创建账号并登录
      responses:
        "200": { description: 新账号、会话令牌与旧数据迁移结果 }
  /auth/login:
    post:
      security: []
      summary: 使用账号密码登录
      responses:
        "200": { description: 当前账号与会话令牌 }
  /auth/desktop-login/challenges:
    post:
      security: []
      summary: 创建桌面扫码登录挑战
      description: 仅允许桌面端从本机回环地址创建短期挑战，返回一次性秘密与过期时间。
      responses:
        "201": { description: 待手机 Hub 扫描的一次性登录挑战 }
        "403": { description: 请求不是来自本机桌面端 }
  /auth/desktop-login/challenges/{id}:
    get:
      security: []
      summary: 查询桌面扫码登录挑战状态
      description: 桌面端使用挑战 ID 与一次性秘密轮询；授权完成后返回本地登录会话和活动 Hub 路由。
      parameters:
        - $ref: "#/components/parameters/Id"
        - in: query
          name: secret
          required: true
          schema: { type: string }
      responses:
        "200": { description: 挑战等待中、凭据恢复中或已授权的结果 }
        "403": { description: 请求不是来自本机桌面端 }
        "404": { description: 挑战不存在、秘密错误或已经过期 }
  /auth/desktop-login/authorize:
    post:
      security: []
      summary: 活动手机 Hub 使用数据空间证明恢复扫码登录
      description: Android Local Hub 使用 Space Key HMAC 证明当前节点身份；电脑 Hub 轮换 Peer 凭据并返回加密信封，尚不会直接完成桌面登录。
      responses:
        "200": { description: 已签发加密 Peer 凭据，等待手机保存并完成认证握手 }
        "401": { description: 数据空间证明无效 }
        "403": { description: 请求节点不是当前活动且未撤销的 Android Hub }
        "409": { description: 挑战已使用或恢复节点不一致 }
  /auth/session:
    get:
      summary: 验证当前会话
      responses:
        "200": { description: 当前登录账号 }
  /auth/logout:
    post:
      summary: 注销当前会话
      responses:
        "204": { description: 已退出登录 }
  /modules:
    get:
      summary: 查询当前账号的已安装模块与有效启用状态
      responses:
        "200": { description: 模块清单、依赖关系和启用状态 }
  /modules/activity:
    get:
      summary: 按游标读取模块调用活动
      responses:
        "200": { description: 模块调用方向、状态、耗时和增量游标 }
    post:
      summary: 记录一次模块调用活动
      responses:
        "200": { description: 已保存的模块调用活动 }
  /modules/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    patch:
      summary: 热启用或停用一个模块
      description: 依赖级联产生的每一条 module_settings 变化与本地设置在同一复制事务中提交。
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200": { description: 更新后的完整模块清单 }
        "409": { description: 核心模块不可停用，或依赖模块尚未启用 }
  /pairing/sessions:
    post:
      summary: 创建短时手机配对会话
      responses:
        "200": { description: 配对会话、一次性秘密与过期时间 }
  /pairing/sessions/{id}:
    get:
      summary: 查询属于当前账号的配对状态
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: 当前配对状态和待确认设备 }
  /pairing/sessions/{id}/claim:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      security: []
      summary: 手机使用一次性秘密申请配对
      responses:
        "200": { description: 已进入待确认状态 }
  /pairing/sessions/{id}/approve:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      summary: 当前账号确认手机配对请求
      responses:
        "200": { description: 已允许手机兑换设备令牌 }
  /pairing/sessions/{id}/redeem:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      security: []
      summary: 已确认的手机兑换设备令牌
      responses:
        "200": { description: 只返回一次的设备令牌与设备信息 }
  /hub-pairing/sessions:
    post:
      summary: 当前活动 Hub 创建一次性节点配对会话
      responses:
        "201": { description: Hub 配对会话与二维码载荷 }
  /hub-pairing/import:
    post:
      summary: 目标 Hub 原子导入已兑换的加密 Space 密钥包
      description: 仅允许替换没有业务数据的本地临时 Space；导入后节点仍处于 Bootstrap 阶段。
      responses:
        "200": { description: 已导入 Space、节点、集群状态和对端凭据 }
        "409": { description: 本地身份、Schema、集群状态或已有数据发生冲突 }
  /hub-pairing/bootstrap/{id}/restore:
    post:
      summary: 将已验证 staging 原子恢复为目标 Hub 的正式结构化副本
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: 已恢复业务数据、Operation、Applied 状态和实体版本 }
        "409": { description: staging 未就绪、仍缺 Blob 或目标 Hub 已有本地数据 }
  /hub-pairing/bootstrap/{id}/status:
    get:
      summary: 查询目标 Hub 的 Bootstrap 和原图续传进度
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: staging 状态、总字节、已确认字节及逐原图断点 }
        "404": { description: staging 不存在或不属于当前账号的 Space }
  /hub-pairing/bootstrap/run:
    post:
      summary: 目标 Hub 自动完成首次全量 Bootstrap
      description: 自动选择已登记端点并执行握手、快照、原图续传、原子恢复、Operation 追平、Watermark 确认和双端 standby 收口。
      responses:
        "200": { description: 首次全量复制完成，目标节点和源端 Snapshot 均已就绪 }
        "409": { description: 本机不是待初始化备用 Hub、已有任务运行或最终摘要不一致 }
        "503": { description: 所有局域网和 Anywhere 端点均不可达 }
  /hub-pairing/bootstrap/{id}/proof:
    post:
      summary: 目标 Hub 生成最终根摘要和连续 Operation 位置证明
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: records root、blobs root 与各来源 Operation 头 }
        "409": { description: Bootstrap 尚未恢复或校验期间数据持续变化 }
  /hub-pairing/bootstrap/{id}/finalize:
    post:
      summary: 目标 Hub 验证活动 Hub 回执并进入 standby
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: 本地节点已标记为 standby }
        "409": { description: 回执无效或最终完整性再次发生变化 }
  /hub-pairing/sessions/{id}:
    get:
      summary: 查询当前账号的 Hub 配对状态
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Hub 配对状态和待确认节点指纹 }
  /hub-pairing/sessions/{id}/resolve:
    post:
      security: []
      summary: 使用二维码中的一次性凭据解析 Hub 配对公开资料
      description: 返回临时公钥、节点标识和候选入口，不返回长期 Peer 凭据、Space Key 或服务端临时私钥。
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: 当前未过期会话的 Hub 配对公开资料 }
        "404": { description: 会话不存在或一次性凭据无效 }
        "410": { description: 配对会话已过期 }
  /hub-pairing/sessions/{id}/claim:
    post:
      security: []
      summary: 新 Hub 使用一次性秘密和临时公钥认领配对会话
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: 已进入待确认状态 }
        "409": { description: 协议、Schema、节点身份或状态不兼容 }
        "410": { description: 配对会话已过期 }
  /hub-pairing/sessions/{id}/reuse:
    post:
      security: []
      summary: 已登记的手机 Hub 使用一次性秘密复用本次一体化配对
      description: 仅在节点仍属于同一 Space 且未撤销时标记 Hub 子任务完成，不签发新 Peer 凭据。
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: 已复用现有手机 Hub，等待客户端配对完成 }
        "409": { description: 节点不存在、已撤销、Space 不匹配或会话状态冲突 }
        "410": { description: 配对会话已过期 }
  /hub-pairing/sessions/{id}/approve:
    post:
      summary: 当前账号确认高权限 Hub 节点配对
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: 已允许新 Hub 兑换加密节点凭据 }
  /hub-pairing/sessions/{id}/redeem:
    post:
      security: []
      summary: 已批准的新 Hub 一次性兑换加密密钥包
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: X25519 协商密钥加密的节点凭据和 Space 同步密钥 }
        "409": { description: 会话未批准或已经兑换 }
        "410": { description: 配对会话已过期 }
  /peer/hello:
    post:
      security:
        - peerHmac: []
      summary: 两个 Hub 协商复制协议、Schema、epoch 与活动节点
      description: 使用完整 Peer HMAC 请求头认证，普通 Bearer Token 无权调用。
      responses:
        "200": { description: 本 Hub 的复制能力与连续 Watermark }
        "409": { description: Space、协议、Schema、epoch 或活动节点不一致 }
  /peer/desktop-login:
    post:
      security:
        - peerHmac: []
      summary: 手机 Hub 在认证握手后确认桌面扫码登录
      description: 仅接受刚刚完成凭据保存并通过 Peer HMAC 认证的 Android Hub；成功后把对应桌面挑战标记为已授权。
      responses:
        "200": { description: 桌面登录挑战已授权，可由桌面端领取会话 }
        "401": { description: Peer HMAC 无效、过期或重放 }
        "403": { description: Peer 不是已配对且未撤销的 Android Hub }
        "409": { description: 挑战已经授权或与恢复节点不一致 }
  /peer/status:
    get:
      security:
        - peerHmac: []
      summary: 查询对端 Hub 的集群和切换状态
      description: 供切换恢复流程确认对端实际阶段；切换事务进行中也允许读取。
      responses:
        "200": { description: 当前节点角色、活动节点、epoch、集群状态和切换事务 }
  /peer/client-sessions/mint:
    post:
      security:
        - peerHmac: []
      summary: 为切换到本 Hub 的客户端签发本地会话
      description: 仅允许已登记的对端 Hub 代当前账号请求，不复制 auth_sessions。
      responses:
        "200": { description: 目标 Hub 的本地 Bearer Token 与账号映射 }
        "401": { description: Peer HMAC 无效、过期或重放 }
  /peer/switch/preflight:
    post:
      security:
        - peerHmac: []
      summary: 由活动 Hub 请求备用 Hub 生成实时切换完整性证明
      description: 在用户级锁内检查 Agent 空闲、数据库 quick_check、Provider 凭证可读性、结构化数据、原图和 Operation 头；响应不包含凭证明文或业务正文，并使用 Space Key HMAC 签名。
      responses:
        "200": { description: 备用 Hub 的实时切换预检证明 }
        "403": { description: 请求节点不是当前活动 Hub，或本机不是完成同步的备用 Hub }
        "409": { description: 集群不稳定、数据库异常、凭证不可读或 Agent 正忙 }
  /peer/synchronize:
    post:
      security:
        - peerHmac: []
      summary: Synchronize the receiving standby Hub before a planned switch
      description: Runs replication through the authenticated native Peer channel without depending on a foreground client or WebView.
      responses:
        "200": { description: Replication status and synchronized operation/media progress }
        "409": { description: The Hub role or cluster state does not allow synchronization }
        "503": { description: The active peer Hub is unreachable }
  /peer/switch/control:
    post:
      security:
        - peerHmac: []
      summary: 应用经过 Space Key 认证的计划切换控制消息
      description: 仅接受当前活动 Hub 发出的 30 秒内控制消息；按顺序推进 preparing_switch、draining、final_sync、integrity_check、committing_switch，或应用 commit/abort。响应 ACK 会绑定控制消息哈希和应用后的 Cluster State 哈希。
      responses:
        "200": { description: 已幂等应用阶段、提交或中止，并返回认证 ACK }
        "403": { description: 控制消息发送节点角色无效 }
        "409": { description: 控制消息认证失败、过期、代次错误或状态转换冲突 }
  /peer/switch/final-sync:
    post:
      security:
        - peerHmac: []
      summary: 让目标备用 Hub 在 final_sync 阶段执行最后一次增量追平
      description: 仅允许当前切换事务的目标备用 Hub 调用其本地复制调度器，从活动 Hub 拉取连续 Operation 和缺失原图。
      responses:
        "200": { description: 最终同步健康状态、Operation 位置和媒体传输结果 }
        "409": { description: 节点角色、切换事务或阶段不匹配，或已有同步正在运行 }
        "503": { description: 当前活动 Hub 不可达 }
  /peer/mobile-switch/start:
    post:
      security:
        - peerHmac: []
      summary: 手机 Hub 提交预检证明并启动计划切换
      responses:
        "200": { description: 已签名的首个切换控制消息 }
        "409": { description: 预检、角色或集群状态不允许切换 }
  /peer/mobile-switch/advance:
    post:
      security:
        - peerHmac: []
      summary: 手机 Hub 提交 ACK 和阶段证明并推进计划切换
      responses:
        "200": { description: 下一阶段控制消息或切换完成状态 }
        "409": { description: ACK、证明或阶段顺序无效 }
  /peer/mobile-switch/request:
    post:
      security:
        - peerHmac: []
      summary: 请求当前活动 Hub 将角色安全交给发起请求的备用 Hub
      description: 用于界面或 WebView 已挂起时仍通过原生 Peer 通道完成计划切换；内部执行预检、最终同步、完整性复核和 commit，不离线排队。
      responses:
        "200": { description: 切换已完成，返回新的活动节点、epoch 和稳定状态 }
        "409": { description: 请求节点不是就绪备用 Hub，或集群不稳定、完整性校验失败 }
        "503": { description: Peer 端点不可达 }
  /peer/media/manifest:
    get:
      security:
        - peerHmac: []
      summary: 分页读取活动 Hub 的原始媒体清单
      description: 按 createdAt 与媒体 ID 稳定排序；返回原图元数据和内容 SHA-256，不传输缩略图，也不传播删除。
      parameters:
        - in: query
          name: cursor
          required: false
          schema: { type: string, description: 不透明 Base64URL 游标 }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 200 }
      responses:
        "200": { description: 媒体清单页、下一游标和是否还有后续页 }
        "409": { description: 当前 Hub 不是稳定状态下的活动节点，或本地媒体文件异常 }
  /peer/media/{id}/blob:
    get:
      security:
        - peerHmac: []
      summary: 读取活动 Hub 的增量原图分块
      description: 单块最多 1 MiB；响应头携带整文件摘要、分块摘要、偏移和总字节数。目标 Hub 完成整文件 SHA-256 后才会原子写入正式媒体目录和 media_assets。
      parameters:
        - $ref: "#/components/parameters/Id"
        - in: query
          name: offset
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: length
          required: false
          schema: { type: integer, minimum: 1, maximum: 1048576, default: 1048576 }
      responses:
        "200": { description: 原图二进制分块及 X-AetherX-Blob/Chunk 校验响应头 }
        "404": { description: 媒体记录或原文件不存在 }
        "409": { description: 当前 Hub 不是活动节点，或记录与原文件不一致 }
        "416": { description: 请求偏移超出原图范围 }
  /peer/media/status:
    post:
      security:
        - peerHmac: []
      summary: 查询接收 Hub 已拥有或待续传的增量媒体状态
      responses:
        "200": { description: 每个媒体项的完成状态和已接收字节数 }
  /peer/media/chunks:
    post:
      security:
        - peerHmac: []
      summary: 向接收 Hub 续传一个增量媒体分块
      responses:
        "200": { description: 当前已确认偏移和整文件校验状态 }
        "409": { description: 媒体元数据、续传偏移或摘要不一致 }
  /peer/snapshots:
    post:
      security:
        - peerHmac: []
      summary: 在稳定边界上生成 Bootstrap 完整性清单
      description: 验证媒体文件后，为每张业务表和媒体清单生成稳定 Merkle Root；生成期间数据变化会自动重试或明确失败。
      responses:
        "201": { description: 快照边界、逐表摘要、records root、blobs root 与 manifest hash }
        "409": { description: 当前 Hub 非活动节点、AI 正忙或数据持续变化 }
        "413": { description: 结构化数据超过单包限制，需要分块 Bootstrap }
  /peer/snapshots/{id}/payload:
    get:
      security:
        - peerHmac: []
      summary: 获取使用 Space Key 加密的结构化 Bootstrap 数据包
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: AES-256-GCM 密文、认证标签、AAD 与载荷摘要 }
        "404": { description: 快照不存在或不是为当前 Peer 生成 }
  /peer/snapshots/{id}/payload/chunks:
    get:
      security:
        - peerHmac: []
      summary: 分块读取加密的结构化 Bootstrap 数据包
      parameters:
        - $ref: "#/components/parameters/Id"
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: length
          schema: { type: integer, minimum: 1, maximum: 1048576, default: 524288 }
      responses:
        "200": { description: Base64 数据块、分块摘要、总大小和下一偏移 }
        "416": { description: 请求偏移超出结构化数据包范围 }
  /peer/snapshots/{id}/blobs/{mediaId}:
    get:
      security:
        - peerHmac: []
      summary: 从活动 Hub 读取快照原图分块
      description: 单块最多 1 MiB；响应头携带整文件摘要、分块摘要、偏移和总字节数，缩略图不跨 Hub 传输。
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/MediaId"
        - in: query
          name: offset
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: length
          required: false
          schema: { type: integer, minimum: 1, maximum: 1048576, default: 1048576 }
      responses:
        "200": { description: 原图二进制分块及 X-AetherX-Blob/Chunk 校验响应头 }
        "404": { description: 快照或原图不属于当前 Peer }
        "409": { description: 源 Hub 非活动节点，或快照生成后原图已经变化 }
        "416": { description: 请求偏移超出原图范围 }
  /peer/snapshots/{id}/blobs/{mediaId}/chunks:
    post:
      security:
        - peerHmac: []
      summary: 目标 Hub 续传并校验一个原图分块
      description: 只接受从已确认偏移开始的连续块；重复块会逐字节校验后幂等确认，最后一块会触发整文件 SHA-256 校验。
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/MediaId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [offset, data, chunkHash]
              properties:
                offset: { type: integer, minimum: 0 }
                data: { type: string, format: byte, description: 最多 1 MiB 原始数据的规范 Base64 }
                chunkHash: { type: string, pattern: "^[a-f0-9]{64}$" }
      responses:
        "200": { description: 当前已确认偏移、Blob 状态及是否为重复块 }
        "400": { description: Base64、块大小或分块摘要无效 }
        "409": { description: 来源、staging 状态、续传偏移或整文件摘要不匹配 }
        "416": { description: 分块超出声明的原图大小 }
  /peer/snapshots/stage:
    post:
      security:
        - peerHmac: []
      summary: 目标 Hub 解密、复核并暂存 Bootstrap 数据包
      description: 重新验证存档连续摘要、逐表 Merkle Root、Operation 哈希链、HMAC 和实体版本；不会直接修改正式业务数据。
      responses:
        "200": { description: staging 验证状态；存在媒体时等待 Blob，纯结构化数据时为 verified }
        "400": { description: 密文、Manifest、Operation 或实体版本校验失败 }
        "409": { description: 同一 Snapshot ID 对应了不同数据包 }
  /peer/bootstrap/complete:
    post:
      security:
        - peerHmac: []
      summary: 活动 Hub 对比目标证明并签发 standby_pending 回执
      responses:
        "200": { description: 使用 Space Key 认证的最终一致性回执 }
        "409": { description: 记录根、媒体根或连续 Operation 位置不一致 }
  /peer/bootstrap/finalize:
    post:
      security:
        - peerHmac: []
      summary: 目标 Hub 完成本地 standby 后通知活动 Hub正式完成 Bootstrap
      responses:
        "200": { description: 两端节点状态均已完成为 standby，Snapshot 标记 completed }
        "409": { description: 回执、节点状态或 Snapshot 状态不匹配 }
  /peer/operations:
    get:
      security:
        - peerHmac: []
      summary: 连续拉取当前 Hub 产生的 Operation
      parameters:
        - in: query
          name: origin
          required: true
          schema: { type: string }
        - in: query
          name: after
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 200 }
      responses:
        "200": { description: Operation 批次、下一游标和头部序号 }
  /peer/operations/apply:
    post:
      security:
        - peerHmac: []
      summary: 原子校验并应用活动 Hub 发来的 Operation 批次
      responses:
        "200": { description: 应用、幂等跳过数量与可回传确认位置 }
        "409": { description: 序列、哈希链、epoch、来源或实体版本冲突 }
  /peer/acknowledgements:
    post:
      security:
        - peerHmac: []
      summary: 对端确认已连续持久化的 Operation 位置
      responses:
        "200": { description: 已保存的连续 Watermark }
        "409": { description: 确认哈希不匹配或 Watermark 倒退 }
  /peer/sync-complete:
    post:
      security:
        - peerHmac: []
      summary: 对端提交已完成同步的 Operation 链头证明
      responses:
        "200": { description: 链头序号和哈希一致，已更新逐 Peer 复制健康状态 }
        "400": { description: 证明指向的来源节点无效 }
        "409": { description: 链头序号或 Operation 哈希与本 Hub 不一致 }
  /peer/divergence-recoveries/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      security:
        - peerHmac: []
      summary: 查询分叉恢复会话的对端状态
      description: 返回恢复阶段、权威节点、目标 epoch、快照摘要和等待确认状态，不包含业务正文。
      responses:
        "200": { description: 当前恢复会话状态 }
        "404": { description: 恢复会话不存在或不属于认证 Peer }
  /peer/divergence-recoveries/{id}/snapshot/chunks:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      security:
        - peerHmac: []
      summary: 向恢复目标连续上传加密快照分块
      description: 分块必须按偏移连续上传，并同时通过 Peer HMAC、分块 SHA-256 和总大小限制校验。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [offset, data, chunkHash]
              properties:
                offset: { type: integer, minimum: 0 }
                data: { type: string, contentEncoding: base64 }
                chunkHash: { type: string, pattern: "^[a-f0-9]{64}$" }
      responses:
        "200": { description: 已确认的连续字节位置，重复分块按幂等请求处理 }
        "409": { description: 分块哈希错误、偏移不连续或会话阶段不允许上传 }
    get:
      security:
        - peerHmac: []
      summary: 从权威 Hub 范围读取加密快照分块
      parameters:
        - in: query
          name: offset
          required: true
          schema: { type: integer, minimum: 0 }
        - in: query
          name: length
          schema: { type: integer, minimum: 1 }
      responses:
        "200": { description: Base64 快照分块、分块摘要、总摘要和完整快照摘要 }
        "416": { description: 请求偏移超出快照范围 }
  /peer/divergence-recoveries/{id}/snapshot/complete:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      security:
        - peerHmac: []
      summary: 完成加密快照上传并应用权威分支
      description: 校验连续分块、总字节数、载荷摘要、Space Key 加密信封、媒体清单和 Operation 哈希链后才应用恢复控制。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [byteSize, payloadHash]
              properties:
                byteSize: { type: integer, minimum: 1 }
                payloadHash: { type: string, pattern: "^[a-f0-9]{64}$" }
      responses:
        "200": { description: 已应用恢复快照并返回 Space Key 签名控制 }
        "409": { description: 快照不完整、摘要不一致、媒体或 Operation 校验失败 }
  /peer/divergence-recoveries/{id}/media/{mediaId}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/MediaId"
    get:
      security:
        - peerHmac: []
      summary: 范围下载权威分支的恢复媒体
      description: 响应头返回整文件摘要、分块摘要、偏移和总大小，接收端必须在落盘前后分别校验。
      parameters:
        - in: query
          name: offset
          required: true
          schema: { type: integer, minimum: 0 }
        - in: query
          name: length
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: 恢复媒体二进制分块
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { description: 媒体不在恢复清单中 }
        "409": { description: 权威分支媒体缺失或大小不匹配 }
        "416": { description: 请求偏移超出媒体范围 }
  /peer/divergence-recoveries/{id}/ack:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      security:
        - peerHmac: []
      summary: 提交恢复应用完成的签名确认
      description: ACK 必须绑定恢复 ID、Space、Peer 节点、权威节点、目标 epoch 和快照摘要，并使用 Space Key HMAC 认证。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ack, authenticationTag]
              properties:
                ack: { type: object }
                authenticationTag: { type: string }
      responses:
        "200": { description: 双端确认完成，集群进入统一的新 epoch }
        "409": { description: ACK 字段、签名或恢复阶段无效 }
  /devices:
    get:
      summary: 查询当前账号的配对设备
      responses:
        "200": { description: 设备列表 }
  /devices/heartbeat:
    post:
      summary: 上报移动端连接与同步健康心跳
      responses:
        "200": { description: Hub 接收时间与当前移动端健康状态 }
  /devices/health:
    get:
      summary: 查询当前账号的移动端健康状态
      responses:
        "200": { description: 移动端在线、同步、SSE、版本与延迟状态 }
  /devices/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    delete:
      summary: 撤销设备及其访问令牌
      responses:
        "204": { description: 已撤销 }
        "409": { description: 设备关联的 Hub 仍处于活动状态，必须先切换 Hub }
  /devices/{id}/record:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    delete:
      summary: 删除已撤销的设备记录
      responses:
        "204": { description: 已删除 }
        "409": { description: 设备仍处于活动状态，必须先撤销访问 }
  /sync/changes:
    get:
      summary: 按游标补拉当前账号的增量变化
      parameters:
        - in: query
          name: after
          schema: { type: integer, minimum: 0 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        "200": { description: 增量变化、下一游标和是否还有更多 }
  /sync/commands:
    get:
      summary: 轮询当前移动安装待处理的 Hub 控制命令
      description: 当反向代理不能稳定转发 SSE 流时，移动端使用此接口作为控制通道兜底。命令按安装标识消费一次。
      parameters:
        - in: query
          name: client_id
          required: true
          schema: { type: string }
      responses:
        "200": { description: 最多十条待处理 Hub 控制命令 }
  /sync/events:
    get:
      summary: 订阅当前账号的 SSE 实时变化通知
      parameters:
        - in: query
          name: after
          schema: { type: integer, minimum: 0 }
        - in: query
          name: client_id
          schema: { type: string }
          description: 移动端安装标识，用于由 Hub 直接确认 SSE 通道状态。
        - in: query
          name: control_only
          schema: { type: integer, enum: [0, 1] }
          description: 设为 1 时只接收 Hub 控制命令，不推送业务变化。
      responses:
        "200":
          description: text/event-stream，先发送 ready，随后发送 change
          content:
            text/event-stream: {}
  /cluster/mobile-hubs:
    get:
      summary: 查询当前账号已经登记的手机 Hub
      responses:
        "200": { description: 手机 Hub 角色、快照、复制健康和控制通道状态 }
  /cluster/mobile-hubs/{id}/synchronize:
    post:
      summary: 请求目标手机立即同步 Local Hub
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: 指令已送达或已定向排队 }
        "404": { description: 手机 Hub 不存在或已撤销 }
  /cluster/mobile-hubs/{id}/discover-endpoint:
    post:
      summary: 验证并登记自动发现的手机 Hub 端点
      description: 桌面端提交局域网发现候选，电脑 Hub 通过已登记 Peer 凭据完成认证 hello 后才保存该端点。
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: 端点已通过 Peer 身份验证并更新优先级 }
        "400": { description: 地址不是允许的私网或 Tailscale Hub 端点 }
        "404": { description: 手机 Hub 不存在或已撤销 }
        "503": { description: 候选端点不可达或 Peer 身份验证失败 }
  /cluster/mobile-hubs/{id}/switch:
    post:
      summary: 请求目标手机安全切换活动 Hub
      description: 电脑 Hub 活动时直接执行 Peer 状态机切到手机；手机 Hub 活动时通过签名 Peer 请求让手机原生 Hub 安全交还电脑，不依赖手机客户端 SSE 或界面前台状态。
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: 切换已完成，返回目标 Hub 和状态机提交结果 }
        "409": { description: 手机副本未就绪、集群不稳定或完整性校验失败 }
        "503": { description: 当前活动 Hub 的 Peer 端点不可达 }
  /cluster/divergence:
    get:
      summary: 查询双 Hub 分叉及恢复状态
      parameters:
        - in: query
          name: recoveryId
          schema: { type: string }
      responses:
        "200": { description: 分叉证据摘要、隔离写入、权威候选和当前恢复进度 }
  /cluster/divergence/evidence:
    get:
      summary: 导出当前分叉的签名证据
      description: 返回双方完整性摘要、Operation 链头和隔离写入清单，并附带 Space Key HMAC 证据标签。
      responses:
        "200": { description: 可审计的分叉证据及其 SHA-256 摘要和认证标签 }
        "409": { description: 当前集群没有可导出的分叉状态 }
  /cluster/divergence/recover:
    post:
      summary: 选择唯一权威 Hub 并发起完整分支恢复
      description: 冻结双方写入，把所选权威分支以 AES-256-GCM 加密快照、媒体校验和签名控制复制到另一 Hub；被舍弃分支保留在签名证据中。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [authority]
              properties:
                authority:
                  type: string
                  enum: [desktop, mobile]
      responses:
        "202": { description: 恢复会话已创建或已有会话已重新投递 }
        "400": { description: 未明确选择手机 Hub 或电脑 Hub }
        "409": { description: 集群不处于可恢复的分叉状态 }
  /cluster/status:
    get:
      summary: 查询当前账号的数据空间与本地 Hub 角色
      description: 首次调用会为现有单 Hub 账号建立稳定的 Space、Node 和 epoch 1 控制状态；不会自动开启双 Hub 复制。
      responses:
        "200":
          description: 当前 Space、活动节点、epoch、复制配置和已登记节点列表
  /cluster/session-handoff:
    post:
      summary: 从备用 Hub 交接到当前活动 Hub
      description: 备用 Hub 使用 Peer HMAC 请求活动 Hub 签发本地会话，并返回活动节点地址；客户端随后以同一 request_id 重试原写请求。
      responses:
        "200": { description: 无需切换，或返回活动 Hub 地址、令牌、节点与 epoch }
        "409": { description: 活动节点或端点不可用 }
        "503": { description: 当前活动 Hub 无法连接 }
  /cluster/switch/preflight:
    post:
      summary: 在不改变集群状态的情况下检查计划切换条件
      description: 当前活动 Hub 获取双方实时证明并比较协议、Schema、epoch、Operation 头、结构化数据根、原图根、Provider 凭证可读性、数据库健康、Agent 状态和未完成同步任务。本接口只读，不会开始切换。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                targetNodeId: { type: string }
      responses:
        "200": { description: ready、逐项门禁结果及双方摘要 }
        "400": { description: 存在多个备用节点但未指定目标，或目标不可信 }
        "409": { description: 本机不是活动 Hub、目标不是 standby 或集群不稳定 }
        "503": { description: 目标 Hub 不可达 }
  /cluster/switch/recovery:
    get:
      summary: 查询未完成计划切换的自动恢复状态
      responses:
        "200": { description: 当前恢复任务、重试次数、下一次尝试和最近错误 }
  /cluster/switch/recover:
    post:
      summary: 立即恢复一次未完成的计划切换
      description: committing_switch 会继续提交；更早阶段会向双方认证中止。目标不可达时保持只读，避免单边解锁。
      responses:
        "200": { description: 已提交、已中止、无需恢复或等待下次重试 }
        "409": { description: 本机不是负责恢复的活动源 Hub }
        "503": { description: 对端不可达，切换锁保持 }
  /cluster/switch/prepare:
    post:
      summary: 开始一次可中止的计划切换并推进到提交门前
      description: 先执行稳定态预检，然后依次进入 preparing_switch、draining、final_sync 和 integrity_check。进入切换后双方普通业务写入返回 423；最终同步和完整性复核通过后返回 transitionId，但不会自动修改 activeNodeId 或 epoch。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                targetNodeId: { type: string }
      responses:
        "200": { description: 已到达 integrity_check，可使用 transitionId 提交或中止 }
        "400": { description: 目标 Hub 不唯一或不可信 }
        "409": { description: 预检失败、节点角色不符或切换状态冲突 }
        "503": { description: 目标 Hub 在阶段同步或确认时不可达 }
  /cluster/switch/commit:
    post:
      summary: 提交已经通过完整性校验的计划切换
      description: 先让目标 Hub 应用 epoch + 1 和新活动节点，再由源 Hub 应用相同控制状态；源 Hub 在收到目标认证 ACK 前保持 committing_switch 只读。目标已提交但响应丢失时可以使用同一 transitionId 重试。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transitionId]
              properties:
                transitionId: { type: string }
      responses:
        "200": { description: 双方已稳定在新 epoch，目标 Hub 成为 active }
        "409": { description: transitionId、完整性、角色或状态不匹配 }
        "503": { description: 目标 Hub 不可达；源 Hub 保持只读并可重试提交 }
  /cluster/switch/abort:
    post:
      summary: 中止尚未进入 committing_switch 的计划切换
      description: 向目标 Hub 发送认证 abort 并等待 ACK，随后双方恢复原 epoch、原活动节点和 stable。committing_switch 不能中止，只能继续提交；目标不可达时源 Hub 保持切换锁，避免双方状态分叉。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transitionId]
              properties:
                transitionId: { type: string }
      responses:
        "200": { description: 双方已恢复 stable，原活动 Hub 重新可写 }
        "409": { description: transitionId 或当前阶段不允许中止 }
        "503": { description: 目标 Hub 不可达，未解除本地切换写锁 }
  /replication/status:
    get:
      summary: 查询本机 Hub 的常驻复制健康状态
      description: 备用 Hub 返回最近尝试、最近成功、连续失败、下次重试、本地/远端 Operation 位置和延迟，并独立返回媒体暂存数量、剩余字节与已接收字节；活动 Hub 返回 serving 状态。
      responses:
        "200": { description: 当前复制角色、健康状态、退避、Operation 延迟和媒体续传积压 }
  /replication/sync:
    post:
      summary: 立即执行一次备用 Hub 增量同步
      description: 忽略后台退避等待，立即握手、连续拉取活动 Hub Operation、确认 Watermark，并按媒体清单续传缺失原图；不会替代首次 Bootstrap。
      responses:
        "200": { description: 同步完成并返回最新健康状态 }
